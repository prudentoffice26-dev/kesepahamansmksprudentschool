<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kesepahaman SMK Prudent School</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            prudent: {
              teal: '#00B4B6',
              blue: '#0A3959',
              lightBlue: '#1363DF',
              bgSoft: '#F8FAFC'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #CBD5E1; /* Slate soft background for PC */
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* App Frame Container (Agar tampilan PC tidak melar/nge-fill) */
    .app-frame {
      max-width: 440px;
      margin: 0 auto;
      background-color: #F8FAFC;
      min-height: 100vh;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Smooth Micro Animations */
    .page-enter {
      animation: fadeInSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .page-exit {
      animation: fadeOutSlide 0.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOutSlide {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-8px); }
    }

    .btn-press:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
  </style>
</head>
<body class="antialiased">

  <!-- APP CONTAINER -->
  <div class="app-frame min-h-screen flex flex-col justify-between pb-8">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <!-- Logo Branding -->
        <div class="flex items-center gap-2 cursor-pointer" onclick="showHalamanUtama()">
          <div class="leading-none">
            <h1 class="text-[11px] font-extrabold tracking-widest text-prudent-teal uppercase">KESEPAHAMAN</h1>
            <p class="text-[8px] font-bold text-prudent-blue tracking-tight">SMKS PRUDENT SCHOOL</p>
          </div>
        </div>

        <!-- Search Input -->
        <div class="relative flex-1 max-w-[180px]">
          <input 
            type="text" 
            id="searchInput"
            placeholder="Cari..." 
            class="w-full bg-slate-100/80 text-xs text-slate-700 pl-8 pr-3 py-1.5 rounded-full border border-slate-200 focus:outline-none focus:border-prudent-teal focus:bg-white transition-all font-medium"
          />
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="w-full px-4 pt-4 flex-1">

      <!-- FRAME 6: HALAMAN UTAMA (LIST BAB) -->
      <section id="halamanUtama" class="space-y-3.5 page-enter">
        <div id="babCardList" class="space-y-3">
          <!-- Rendered by app.js -->
        </div>
      </section>

      <!-- FRAME 7: HALAMAN PENJELASAN BAB / DETAIL -->
      <section id="halamanPenjelasan" class="hidden space-y-4">
        <!-- Button Back & Judul BAB -->
        <button id="btnBack" class="flex items-center gap-2 text-slate-900 font-extrabold text-base md:text-lg tracking-tight btn-press py-1">
          <svg class="w-5 h-5 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
          <span id="detailBabTitle" class="uppercase">LOREM IPSUM</span>
        </button>

        <!-- Intro Deskripsi BAB -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
          <p id="detailBabDeskripsi" class="text-xs text-slate-600 leading-relaxed font-medium">
            <!-- Text deskripsi bab -->
          </p>
        </div>

        <!-- List Poin Ber-Nomor (Frame 7 Figma) -->
        <div id="detailPasalContainer" class="space-y-2.5">
          <!-- Rendered by app.js -->
        </div>
      </section>

    </main>

  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
