<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen Kesepahaman SMK Prudent School</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 sm:p-6 lg:p-10">

  <!-- Header Utama -->
  <header class="max-w-7xl mx-auto mb-8 text-center bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
    <h1 id="app-title" class="text-xl sm:text-2xl md:text-3xl font-bold tracking-tight text-[#00639A] uppercase">
      DOKUMEN KESEPAHAMAN SMK PRUDENT SCHOOL TAHUN AJARAN 2026/2027
    </h1>
    <p class="mt-2 text-sm sm:text-base text-slate-500 font-medium">
      Sistem Informasi & Panduan Budaya Kerja Profesional SMK Prudent School
    </p>
  </header>

  <!-- Container Navigasi Tab -->
  <div class="max-w-7xl mx-auto mb-8">
    <div id="tabs-container" class="flex overflow-x-auto space-x-2 pb-2 scrollbar-thin scrollbar-thumb-slate-300">
      <!-- Tabs akan di-render dinamis oleh app.js -->
    </div>
  </div>

  <!-- Konten Utama Berdasarkan Tab Active -->
  <main className="max-w-7xl mx-auto">
    <section id="tab-content" class="max-w-7xl mx-auto">
      <!-- Konten pasal & bab akan di-render dinamis oleh app.js -->
    </section>
  </main>

  <!-- External JS Script -->
  <script src="JS.js"></script>
</body>
</html>
