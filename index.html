<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kesepahaman App - SMK Prudent School</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Transitions & Micro-interactions */
    .page-enter {
      animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .page-exit {
      animation: slideOutRight 0.25s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutRight {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-20px); }
    }

    /* Chevron rotation for accordion */
    .accordion-icon {
      transition: transform 0.3s ease;
    }
    .accordion-open .accordion-icon {
      transform: rotate(180deg);
    }

    /* Accordion Content Smooth Toggle */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0, 1, 0, 1), opacity 0.3s ease;
      opacity: 0;
    }
    .accordion-open .accordion-content {
      max-height: 2000px;
      opacity: 1;
      transition: max-height 0.5s ease-in-out, opacity 0.35s ease;
    }

    /* Hover effects only for pointer devices (Desktop) */
    @media (hover: hover) and (pointer: fine) {
      .btn-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      .card-hover:hover {
        border-color: #14b8a6;
      }
    }

    /* Active Press Micro-interaction (Mobile & Desktop) */
    .btn-press:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header Banner -->
  <header class="bg-brand-500 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-4 text-center">
      <h1 class="text-xl md:text-2xl font-bold tracking-wide">Kesepahaman App</h1>
      <p class="text-xs md:text-sm text-brand-100 mt-0.5">SMK Prudent School TA 2026/2027</p>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 relative overflow-x-hidden">

    <!-- ================= HALAMAN UTAMA ================= -->
    <section id="halamanUtama" class="space-y-4 page-enter">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
        <h2 class="text-lg font-bold text-slate-800 mb-1">Daftar Dokumen Kesepahaman</h2>
        <p class="text-xs text-slate-500">Pilih BAB di bawah ini untuk melihat detail pasal, tata tertib, dan ketentuan lengkap.</p>
      </div>

      <!-- List BAB Buttons -->
      <div id="babList" class="grid gap-3">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

    <!-- ================= HALAMAN PENJELASAN BAB ================= -->
    <section id="halamanPenjelasan" class="hidden space-y-5">
      <!-- Top Navigation / Button Back -->
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <button id="btnBack" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-semibold text-brand-700 bg-brand-50 rounded-lg border border-brand-200 btn-hover btn-press transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Kembali ke Halaman Utama
        </button>
      </div>

      <!-- Judul BAB -->
      <div class="bg-brand-50 border-l-4 border-brand-500 p-4 rounded-r-xl">
        <h2 id="babTitle" class="text-lg md:text-xl font-bold text-slate-900">Judul BAB</h2>
        <p id="babSubtitle" class="text-xs text-brand-700 mt-1 uppercase tracking-wider font-semibold">Sub-Judul BAB</p>
      </div>

      <!-- Container Card Pasal (Dropdowns) -->
      <div id="pasalContainer" class="space-y-3">
        <!-- Card Pasal items will be rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
    &copy; 2026 SMK Prudent School. All Rights Reserved.
  </footer>

  <!-- Script JS -->
  <script src="app.js"></script>
</body>
</html>
