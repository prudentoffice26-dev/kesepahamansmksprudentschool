<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kesepahaman App - SMK Prudent School</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-card {
      animation: slideUpFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .detail-modal {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
    .detail-modal.modal-closed {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }
    .detail-modal.modal-open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex justify-center items-start md:py-8">

  <!-- APP CONTAINER -->
  <div class="w-full max-w-md md:max-w-5xl bg-white min-h-screen md:min-h-[800px] md:rounded-3xl md:border md:border-slate-200/80 shadow-2xl flex flex-col md:flex-row relative pb-28 md:pb-0 overflow-hidden">

    <!-- DESKTOP SIDEBAR NAV -->
    <aside class="hidden md:flex flex-col w-64 border-r border-slate-100 p-6 space-y-8 shrink-0 bg-slate-50/50">
      <div>
        <h1 class="font-extrabold text-sm uppercase tracking-wider text-brand-700">KESEPAHAMAN</h1>
        <p class="text-[11px] text-slate-500 font-medium">SMKS PRUDENT SCHOOL</p>
      </div>

      <nav class="space-y-1.5 flex-1">
        <button onclick="switchTab('Penampilan')" id="sidebar-tab-Penampilan" class="sidebar-tab w-full flex items-center space-x-3 px-3.5 py-3 rounded-2xl font-bold text-xs active:bg-slate-100 transition-colors text-brand-600 bg-brand-50">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span>Penampilan</span>
        </button>

        <button onclick="switchTab('Kehadiran')" id="sidebar-tab-Kehadiran" class="sidebar-tab w-full flex items-center space-x-3 px-3.5 py-3 rounded-2xl font-bold text-xs active:bg-slate-100 transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Kehadiran</span>
        </button>

        <button onclick="switchTab('Ketentuan Umum')" id="sidebar-tab-Ketentuan-Umum" class="sidebar-tab w-full flex items-center space-x-3 px-3.5 py-3 rounded-2xl font-bold text-xs active:bg-slate-100 transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>Ketentuan Umum</span>
        </button>

        <button onclick="switchTab('Hak & Peran')" id="sidebar-tab-Hak-Peran" class="sidebar-tab w-full flex items-center space-x-3 px-3.5 py-3 rounded-2xl font-bold text-xs active:bg-slate-100 transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span>Hak & Peran</span>
        </button>

        <button onclick="switchTab('Pengesahan')" id="sidebar-tab-Pengesahan" class="sidebar-tab w-full flex items-center space-x-3 px-3.5 py-3 rounded-2xl font-bold text-xs active:bg-slate-100 transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <span>Pengesahan</span>
        </button>
      </nav>

      <div class="pt-4 border-t border-slate-200/60">
        <span class="text-[10px] font-semibold text-slate-400 block">Tahun Ajaran</span>
        <span class="text-xs font-bold text-brand-700">2026/2027</span>
      </div>
    </aside>

    <!-- RIGHT CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- HEADER BAR -->
      <header class="sticky top-0 bg-white/90 backdrop-blur-md z-30 border-b border-slate-100 p-4 md:px-8 md:py-5 flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div class="flex items-center justify-between md:hidden">
          <div>
            <h1 class="font-bold text-xs uppercase tracking-wider text-brand-700">KESEPAHAMAN</h1>
            <p class="text-[10px] text-slate-500 font-medium">SMKS PRUDENT SCHOOL</p>
          </div>
          <span class="text-[10px] font-semibold bg-brand-50 text-brand-700 px-2.5 py-1 rounded-full border border-brand-200">
            2026/2027
          </span>
        </div>

        <div class="relative w-full">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Cari seragam, rambut, atau aturan..." 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all placeholder:text-slate-400"
            oninput="handleSearch(this.value)"
          >
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main id="listView" class="p-4 md:p-8 flex-1 space-y-4 overflow-y-auto">
        <div class="flex justify-between items-center px-1">
          <h2 id="tabTitle" class="font-extrabold text-lg md:text-xl text-slate-900 tracking-tight">Penampilan</h2>
          <span id="cardCount" class="text-xs text-slate-400 font-medium">0 Aturan</span>
        </div>

        <div id="cardsContainer" class="space-y-3">
          <!-- Rendered by JS -->
        </div>
      </main>

    </div>

    <!-- DETAIL VIEW MODAL -->
    <section id="detailView" class="detail-modal modal-closed hidden fixed inset-0 md:absolute bg-white z-40 w-full max-w-md md:max-w-none mx-auto flex flex-col overflow-y-auto pb-28 md:pb-8">
      <div class="sticky top-0 bg-white/95 backdrop-blur-md p-4 md:px-8 border-b border-slate-100 flex items-center space-x-3 z-10">
        <button onclick="closeDetail()" class="p-2 rounded-xl bg-slate-100 active:bg-slate-200 text-slate-700 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="flex-1 min-w-0">
          <span id="detailPasal" class="text-[10px] font-bold uppercase tracking-wider text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">
            PASAL
          </span>
          <h3 id="detailTitle" class="font-bold text-sm md:text-base text-slate-900 truncate mt-0.5">Judul Detail</h3>
        </div>
      </div>

      <div class="p-4 md:p-8 space-y-5 flex-1 max-w-3xl">
        <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Deskripsi Lengkap</p>
          <p id="detailSummary" class="text-xs md:text-sm text-slate-700 leading-relaxed font-medium"></p>
        </div>

        <div>
          <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 px-1">Poin Aturan Resmi</h4>
          <div id="detailPoints" class="space-y-3">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- FLOATING BOTTOM NAV BAR -->
    <div class="fixed bottom-4 left-0 right-0 z-30 flex justify-center px-3 pointer-events-none md:hidden">
      <nav class="w-full max-w-md bg-white/95 backdrop-blur-md border border-slate-200/90 p-1.5 flex justify-between items-center rounded-2xl shadow-xl shadow-slate-900/10 pointer-events-auto">
        
        <button onclick="switchTab('Penampilan')" id="tab-Penampilan" class="nav-tab flex-1 min-w-0 flex flex-col items-center py-1 px-1 rounded-xl transition-colors text-brand-600">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="text-[8px] font-bold tracking-tighter truncate w-full text-center mt-1">Penampilan</span>
        </button>

        <button onclick="switchTab('Kehadiran')" id="tab-Kehadiran" class="nav-tab flex-1 min-w-0 flex flex-col items-center py-1 px-1 rounded-xl transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-[8px] font-bold tracking-tighter truncate w-full text-center mt-1">Kehadiran</span>
        </button>

        <button onclick="switchTab('Ketentuan Umum')" id="tab-Ketentuan-Umum" class="nav-tab flex-1 min-w-0 flex flex-col items-center py-1 px-1 rounded-xl transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span class="text-[8px] font-bold tracking-tighter truncate w-full text-center mt-1">Umum</span>
        </button>

        <button onclick="switchTab('Hak & Peran')" id="tab-Hak-Peran" class="nav-tab flex-1 min-w-0 flex flex-col items-center py-1 px-1 rounded-xl transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span class="text-[8px] font-bold tracking-tighter truncate w-full text-center mt-1">Hak & Peran</span>
        </button>

        <button onclick="switchTab('Pengesahan')" id="tab-Pengesahan" class="nav-tab flex-1 min-w-0 flex flex-col items-center py-1 px-1 rounded-xl transition-colors text-slate-400">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <span class="text-[8px] font-bold tracking-tighter truncate w-full text-center mt-1">Pengesahan</span>
        </button>

      </nav>
    </div>

  </div>

  <script src="script.js"></script>
